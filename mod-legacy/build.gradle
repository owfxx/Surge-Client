plugins {
	id "net.fabricmc.fabric-loom-remap" version "${loom_version}"
	id "legacy-looming" version "${loom_version}"
}

version = project.version
group = project.group

base { archivesName = 'surge-client' }

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings(legacy.yarn(project.minecraft_version, project.yarn_build))
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.legacyfabric.legacy-fabric-api:legacy-fabric-api:${project.fabric_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") { expand "version": version }
	from("../mod/src/main/resources/assets/surge/textures/cosmetic") { into "assets/surge/textures/cosmetic" }
}

tasks.matching { it.name == "runClient" }.configureEach {
	javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
}

loom {
	runs {
		client {
			programArgs "--width", "1600", "--height", "900"
			if (project.hasProperty('autotest')) vmArg "-Dsurge.autotest=true"
		}
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 8
}

java {
	sourceCompatibility = JavaVersion.VERSION_1_8
	targetCompatibility = JavaVersion.VERSION_1_8
}

tasks.register('copyToLauncher', Copy) {
	dependsOn remapJar
	from remapJar.archiveFile
	into file("../launcher/resources/mods/${project.minecraft_version}")
}
build.finalizedBy copyToLauncher
