plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

base { archivesName = 'surge-client' }

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	implementation "javazoom:jlayer:1.0.1"
	include "javazoom:jlayer:1.0.1"
}

processResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") { expand "version": version }
}

loom {
	runs {
		client {
			programArgs "--width", "1600", "--height", "900"
			if (project.hasProperty('autotest')) {
				vmArg "-Dsurge.autotest=true"
				vmArg "-Dmixin.debug.countInjections=true"
			}
		}
	}
}

tasks.withType(JavaCompile).configureEach { it.options.release = 21 }

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

tasks.register('copyToLauncher', Copy) {
	dependsOn remapJar
	from remapJar.archiveFile
	into file("../launcher/resources/mods/${project.minecraft_version}")
}
build.finalizedBy copyToLauncher
