name: Build Surge Client
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  server:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - name: Deploy online service
        id: deploy
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: bash deploy.sh
      - name: Share the service address
        if: steps.deploy.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "{\"api\":\"${{ steps.deploy.outputs.url }}\"}" > service.json
          gh release view data -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create data -R "$GITHUB_REPOSITORY" --title "Codes and sales" --notes "Used by Surge Client. Don't delete." --latest=false
          gh release upload data service.json --clobber -R "$GITHUB_REPOSITORY"

  build:
    needs: server
    if: always()
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '25' }
      - uses: actions/setup-node@v5
        with: { node-version: '22' }

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          sed -i "s/^version=.*/version=${VER}+mc1.21.11/" mod/gradle.properties
          node -e "const f='launcher/package.json';const p=require('./'+f);p.version='${VER}';require('fs').writeFileSync(f,JSON.stringify(p,null,2)+'\n')"

      - name: Is this a new version?
        id: ver
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(node -p "require('./launcher/package.json').version")
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF}" = "refs/heads/main" ] && ! gh release view "v$VER" >/dev/null 2>&1; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Point the launcher at this repo for updates
        shell: bash
        run: echo "{\"repo\":\"${GITHUB_REPOSITORY}\",\"api\":\"${{ needs.server.outputs.url }}\"}" > launcher/resources/update-source.json

      - name: Build mod
        working-directory: mod
        shell: bash
        run: |
          for i in 1 2 3 4; do ./gradlew.bat build && exit 0; echo "retry $i"; sleep 20; done
          exit 1

      - name: Build launcher
        working-directory: launcher
        shell: bash
        run: |
          for i in 1 2 3; do npm ci && break; sleep 15; done
          for i in 1 2 3 4; do npx electron-builder --win portable --x64 && exit 0; echo "retry $i"; sleep 20; done
          exit 1

      - name: Collect files
        shell: bash
        run: |
          mkdir -p out
          cp launcher/dist/*-Standalone.exe out/
          for f in mod/build/libs/surge-client-*.jar; do
            case "$f" in *-sources.jar) continue;; esac
            cp "$f" "out/$(basename "$f" | sed 's/+/-/')"
            cp "$f" out/Surge-Client-Mod.jar
          done
          cp launcher/dist/*-Standalone.exe out/Surge-Client.exe
          ls -la out

      - uses: actions/upload-artifact@v5
        with:
          name: surge-client
          path: out/*

      - name: Release notes
        shell: bash
        run: |
          V="${{ steps.ver.outputs.version }}"
          [ -z "$V" ] && V="${GITHUB_REF_NAME#v}"
          awk -v v="## $V" '$0==v{f=1;next} /^## /{f=0} f' mod/src/main/resources/changelog.md | sed '/^[[:space:]]*$/d' > notes.md
          [ -s notes.md ] || echo "- Fixes and improvements" > notes.md
          cat notes.md

      - name: Publish release (tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          body_path: notes.md

      - name: Publish release (new version on main)
        if: steps.ver.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Surge Client ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: out/*
          body_path: notes.md

  autotest:
    if: contains(github.event.head_commit.message, '[test]') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '25' }
      - name: Install a virtual screen
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 mesa-utils libopenal1 > /dev/null
      - name: Run the game and take screenshots
        working-directory: mod
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_GL_VERSION_OVERRIDE: '4.5'
          ALSOFT_DRIVERS: 'null'
        run: |
          chmod +x gradlew
          for i in 1 2 3 4; do ./gradlew --version >/dev/null && break; sleep 20; done
          timeout 1200 xvfb-run -a -s "-screen 0 1600x900x24" ./gradlew runClient -Pautotest --no-configuration-cache || true
          ls -la run/screenshots || true
      - name: List game API
        if: always()
        run: |
          mkdir -p shots
          JARS=$(find ~/.gradle/caches mod/.gradle -name "*.jar" 2>/dev/null | grep -i minecraft | grep -iv sources)
          CP=""
          for j in $JARS; do if unzip -l "$j" 2>/dev/null | grep -q "net/minecraft/client/Minecraft.class\|net/minecraft/world/entity/Entity.class\|com/mojang/blaze3d/systems/RenderSystem.class"; then CP="$CP:$j"; fi; done
          echo "cp: $CP" > shots/api.txt
          for j in $(echo "$CP" | tr ':' ' '); do unzip -l "$j" | grep -E "renderer/fog/|PlayerSkinWidget|SkinManager|Glint|glint|MobEffectTextureManager|TextureManager" | awk '{print $4}' >> shots/api.txt; done
          for c in net.minecraft.client.gui.components.PlayerSkinWidget net.minecraft.client.resources.SkinManager net.minecraft.client.renderer.entity.state.AvatarRenderState net.minecraft.client.renderer.texture.DynamicTexture net.minecraft.client.gui.GuiGraphics net.minecraft.client.gui.Gui net.minecraft.client.renderer.texture.TextureManager net.minecraft.client.Screenshot net.minecraft.client.renderer.entity.ItemRenderer net.minecraft.client.renderer.fog.FogRenderer net.minecraft.client.renderer.fog.FogData net.minecraft.client.renderer.fog.environment.FogEnvironment net.minecraft.client.renderer.fog.environment.AtmosphericFogEnvironment net.minecraft.client.renderer.fog.environment.WaterFogEnvironment net.minecraft.client.renderer.fog.environment.LavaFogEnvironment net.minecraft.client.renderer.fog.environment.PowderedSnowFogEnvironment net.minecraft.client.renderer.fog.environment.BlindnessFogEnvironment net.minecraft.client.renderer.fog.environment.DarknessFogEnvironment net.minecraft.client.renderer.fog.environment.MobEffectFogEnvironment com.mojang.blaze3d.systems.GpuDevice com.mojang.blaze3d.systems.CommandEncoder com.mojang.blaze3d.pipeline.RenderTarget net.minecraft.client.multiplayer.PlayerInfo net.minecraft.world.entity.player.PlayerSkin net.minecraft.client.resources.DefaultPlayerSkin net.minecraft.client.renderer.RenderPipelines net.minecraft.core.ClientAsset net.minecraft.core.ClientAsset\$Texture net.minecraft.core.ClientAsset\$ResourceTexture net.minecraft.core.ClientAsset\$DownloadedTexture net.minecraft.client.renderer.entity.layers.WingsLayer net.minecraft.client.renderer.entity.EntityRenderDispatcher net.minecraft.client.gui.screens.inventory.InventoryScreen net.minecraft.client.renderer.entity.state.LivingEntityRenderState net.minecraft.client.renderer.entity.state.EntityRenderState net.minecraft.client.gui.components.PlayerTabOverlay net.minecraft.client.gui.components.ChatComponent net.minecraft.client.GuiMessage net.minecraft.client.gui.components.DebugScreenOverlay net.minecraft.client.renderer.entity.player.AvatarRenderer net.minecraft.client.renderer.entity.layers.CapeLayer net.minecraft.client.gui.render.pip.GuiEntityRenderer net.minecraft.client.renderer.LevelRenderer net.minecraft.client.renderer.culling.Frustum; do echo "=== $c" >> shots/api.txt; javap -p -cp "$CP" "$c" >> shots/api.txt 2>&1; done
          echo "=== Minecraft (filtered)" >> shots/api.txt
          javap -p -cp "$CP" net.minecraft.client.Minecraft | grep -iE "profile|skin|services|session|window|textureManager|getEntityModels|modelManager" >> shots/api.txt 2>&1
      - name: Publish screenshots
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p shots
          cp mod/run/screenshots/*.png shots/ 2>/dev/null || true
          cp mod/run/logs/latest.log shots/latest.log 2>/dev/null || true
          ls shots
          gh release view autotest -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create autotest -R "$GITHUB_REPOSITORY" --title "Test screenshots" --notes "Automatic test run screenshots." --prerelease --latest=false
          for a in $(gh release view autotest -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name'); do gh release delete-asset autotest "$a" -R "$GITHUB_REPOSITORY" -y || true; done
          gh release upload autotest shots/* --clobber -R "$GITHUB_REPOSITORY"
