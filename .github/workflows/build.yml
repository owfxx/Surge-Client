name: Build Surge Client
# Every push builds the mod and launcher. When the version in launcher/package.json is new
# (no release for it yet), a GitHub Release is published automatically, and every Surge
# launcher picks up the new mod (next time Play is pressed) and offers the new launcher.
# To release: run release.bat (or node scripts/set-version.js X.Y.Z, commit, push).
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      # Fabric Loom needs Java 25 to run Gradle; the mod itself still targets Java 21.
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '25' }
      - uses: actions/setup-node@v5
        with: { node-version: '22' }

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          sed -i "s/^version=.*/version=${VER}+mc1.21.11/" mod/gradle.properties
          node -e "const f='launcher/package.json';const p=require('./'+f);p.version='${VER}';require('fs').writeFileSync(f,JSON.stringify(p,null,2)+'\n')"

      - name: Is this a new version?
        id: ver
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(node -p "require('./launcher/package.json').version")
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF}" = "refs/heads/main" ] && ! gh release view "v$VER" >/dev/null 2>&1; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Point the launcher at this repo for updates
        shell: bash
        run: echo "{\"repo\":\"${GITHUB_REPOSITORY}\"}" > launcher/resources/update-source.json

      - name: Build mod
        working-directory: mod
        run: ./gradlew.bat build

      - name: Build launcher
        working-directory: launcher
        run: |
          npm ci
          npx electron-builder --win portable --x64

      - name: Collect files
        shell: bash
        run: |
          mkdir -p out
          cp launcher/dist/*-Standalone.exe out/
          for f in mod/build/libs/surge-client-*.jar; do
            case "$f" in *-sources.jar) continue;; esac
            cp "$f" "out/$(basename "$f" | sed 's/+/-/')"
          done
          ls -la out

      - uses: actions/upload-artifact@v5
        with:
          name: surge-client
          path: out/*

      - name: Publish release (tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true

      - name: Publish release (new version on main)
        if: steps.ver.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Surge Client ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: out/*
          generate_release_notes: true
