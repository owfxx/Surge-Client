<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; connect-src 'self' https:">
  <title>Surge Client</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="titlebar">
    <img src="assets/icon.png" alt="" class="brand-icon">
    <div class="win-buttons">
      <button data-win="min" aria-label="Minimize"><svg viewBox="0 0 12 12"><path d="M2.5 6h7"/></svg></button>
      <button data-win="max" aria-label="Maximize"><svg viewBox="0 0 12 12"><rect x="2.5" y="2.5" width="7" height="7" rx="1"/></svg></button>
      <button data-win="close" class="close" aria-label="Close"><svg viewBox="0 0 12 12"><path d="M3 3l6 6M9 3l-6 6"/></svg></button>
    </div>
  </header>

  <div class="layout">
    <nav class="sidebar">
      <button class="nav active" data-view="home" data-tip="Play" aria-label="Play"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5c0-1 1.1-1.6 1.9-1.1l9.4 6.1c.8.5.8 1.6 0 2.1l-9.4 6.1c-.8.5-1.9-.1-1.9-1.1z"/></svg></button>
      <button class="nav" data-view="packs" data-tip="Modpacks" aria-label="Modpacks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 9 4.5-9 4.5-9-4.5z"/><path d="m3 12 9 4.5 9-4.5"/><path d="m3 16.5 9 4.5 9-4.5"/></svg></button>
      <button class="nav" data-view="skins" data-tip="Skins" aria-label="Skins"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7.5" r="3.5"/><path d="M5 20.5c.6-3.9 3.4-6 7-6s6.4 2.1 7 6"/></svg></button>
      <button class="nav" data-view="wardrobe" data-tip="Wardrobe" aria-label="Wardrobe"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6.5a2 2 0 1 1 2-2"/><path d="M12 6.5v1.2L3.6 14.3A1.6 1.6 0 0 0 4.6 17h14.8a1.6 1.6 0 0 0 1-2.7L12 7.7"/></svg></button>
      <button class="nav" data-view="servers" data-tip="Servers" aria-label="Servers"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4" width="17" height="6.5" rx="2"/><rect x="3.5" y="13.5" width="17" height="6.5" rx="2"/><path d="M7.5 7.25h.01M7.5 16.75h.01"/></svg></button>
      <button class="nav" data-view="browse" data-tip="Browse" aria-label="Browse"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg></button>
      <button class="nav" data-view="settings" data-tip="Settings" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
      <div class="spacer"></div>
      <button class="nav ext" id="discordBtn" data-tip="Join our Discord" aria-label="Join our Discord"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.6 5.6A16 16 0 0 0 15.7 4.4l-.5 1a14.8 14.8 0 0 0-4.4 0l-.5-1a16 16 0 0 0-3.9 1.2C3.9 9.4 3.2 13.1 3.5 16.7a16.2 16.2 0 0 0 4.8 2.4l1-1.6c-.6-.2-1.1-.5-1.6-.8l.4-.3a11.4 11.4 0 0 0 9.8 0l.4.3c-.5.3-1 .6-1.6.8l1 1.6a16.2 16.2 0 0 0 4.8-2.4c.4-4.2-.6-7.9-2.9-11.1ZM9.4 14.5c-.9 0-1.7-.9-1.7-1.9s.7-1.9 1.7-1.9 1.7.9 1.7 1.9-.8 1.9-1.7 1.9Zm5.2 0c-.9 0-1.7-.9-1.7-1.9s.7-1.9 1.7-1.9 1.7.9 1.7 1.9-.8 1.9-1.7 1.9Z"/></svg></button>
      <button class="account" id="accountBtn" data-tip="Sign in" aria-label="Account">
        <img id="accountHead" src="assets/icon.png" alt="">
        <span id="accountName" hidden>Sign in</span>
      </button>
    </nav>

    <canvas id="bgfx" aria-hidden="true"></canvas>
    <main id="view"></main>
  </div>

  <div id="tasks" class="tasks"></div>
  <div id="toasts" class="toasts"></div>
  <div id="tip" class="tip hidden"></div>
  <div id="modal" class="modal hidden"><div class="modal-card" id="modalCard"></div></div>

  <script src="vendor/three.min.js"></script>
  <script src="vendor/skinview3d.bundle.js"></script>
  <script src="app.js"></script>
</body>
</html>
